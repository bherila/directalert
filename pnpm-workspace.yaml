allowBuilds:
  '@swc/core': true
  '@parcel/watcher': false
  esbuild: true
  spotlight-noindex: true
  unrs-resolver: true

overrides:
  nanoid: 3.3.18
  'shell-quote@<1.11.0': 1.11.0
  # glob 14 supports minimatch 11's Matcher objects; upgrading minimatch alone
  # breaks the older glob walkers used by Jest and coverage instrumentation.
  'glob@10.5.0': 14.0.3
  'glob@13.0.6': 14.0.3
  'test-exclude@7.0.2>minimatch': 11.0.4

# Jest 30's babel-preset-current-node-syntax pulls in Babel 7 syntax plugins
# that declare a @babel/core ^7 peer. Those syntaxes are built into Babel 8, so
# the plugins are no-ops and work fine under @babel/core 8.
peerDependencyRules:
  allowedVersions:
    '@babel/core': '8'
