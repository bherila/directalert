name: Deploy to Production

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Install Composer (with dev)
        run: composer install --no-interaction --prefer-dist
        
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build frontend and run tests
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run test

      - name: Run PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml

  deploy:
    runs-on: ubuntu-24.04-arm
    needs: test
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Install Composer (no dev)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
        
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Append to .htaccess
        run: cat htaccess-append.txt >> public/.htaccess

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      # Pin the production host key instead of trusting whatever answers on
      # first connect. SSH_KNOWN_HOSTS (prod environment) holds the deploy host's
      # ssh-keyscan output. An empty or unparseable value fails the deploy here
      # rather than falling back to unchecked connections.
      - name: Pin production SSH host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          SSH_KNOWN_HOSTS="${SSH_KNOWN_HOSTS:-}"
          if [ -z "${SSH_KNOWN_HOSTS//[[:space:]]/}" ]; then
            echo "::error::The SSH_KNOWN_HOSTS secret is empty or unset in the prod environment. Set it to the deploy host's ssh-keyscan output; the deploy will not connect without a pinned host key."
            exit 1
          fi
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"
          if ! ssh-keygen -l -f "$RUNNER_TEMP/ssh/known_hosts" > /dev/null; then
            echo "::error::The SSH_KNOWN_HOSTS secret is not a valid known_hosts file."
            exit 1
          fi

      # Every connection checks the pinned key and sends keepalives, so an
      # idle-timeout middlebox cannot silently drop the session mid-deploy.
      - name: Deploy with rsync
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -av --delete --exclude='.env' \
            -e "ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts -o ServerAliveInterval=15 -o ServerAliveCountMax=4" \
            app \
            bootstrap \
            config \
            database \
            public \
            resources \
            routes \
            storage \
            vendor \
            artisan \
            composer.json \
            composer.lock \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/directalert-app/

      - name: Run artisan config clear/cache on server
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "cd ~/directalert-app && /opt/cpanel/ea-php85/root/usr/bin/php artisan config:clear && /opt/cpanel/ea-php85/root/usr/bin/php artisan config:cache && cd ~ && rm -rf directalert.middlesexwater.com && ln -s directalert-app/public directalert.middlesexwater.com"
